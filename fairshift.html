<html lang="en">

<div id="app" class="app-shell flex">
  <aside id="sidebar" class="sidebar min-h-screen p-5 flex flex-col">
    <div class="flex items-center gap-3 mb-8">
      <div class="brand-mark">F</div><div><div class="font-extrabold text-lg tracking-tight">FairShift</div><div class="text-xs text-purple-200">Decent work, by design</div></div>

        <p class="text-xs text-purple-100 leading-relaxed mt-2">Fair pay, safer shifts, and a voice at work.</p>
      </div>
      <div class="text-xs text-purple-200">Prototype · Local demo data</div>
    </div>
  </aside>
  <div id="sidebarShade" class="hidden fixed inset-0 bg-black/40 z-40" onclick="closeMenu()"></div>
  <main class="main-area flex-1 min-w-0">

    <footer class="px-6 pb-6 text-xs muted">FairShift · SDG 8 · Prototype only. Data stays in this browser and is not a secure multi-user system.</footer>
  </main>
</div>
<div id="modalRoot"></div><div id="toastRoot" aria-live="polite"></div>

let state;
function loadState(){
 try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const parsed=JSON.parse(raw);if(parsed&&parsed.workers&&parsed.shifts)return {...seedData(),...parsed};}}catch(e){console.warn("Could not load saved demo state",e)}
 return seedData();
}
state=loadState();
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){toast("Could not save to browser storage. Your browser may be in private mode.");}}
function activity(text){state.activity.unshift({id:uid("ACT"),text,createdAt:isoNow()});state.activity=state.activity.slice(0,30);}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function fmtDate(d){return d?new Date(d).toLocaleString(state.language==="hi"?"hi-IN":state.language==="ta"?"ta-IN":"en-IN",{dateStyle:"medium",timeStyle:"short"}):"—";}
function fmtHours(h){return `${Math.floor(h)}h ${Math.round((h%1)*60)}m`;}
function worker(id="W-1001"){return state.workers.find(w=>w.id===id)||state.workers[0];}
function currentWorker(){return worker("W-1001");}
function hoursForShift(s,now=Date.now()){return hoursBetween(s.checkIn,s.checkOut||new Date(now).toISOString());}
function shiftTotals(workerId="W-1001"){
 const list=state.shifts.filter(s=>s.workerId===workerId);
 const regular= list.reduce((sum,s)=>sum+Math.min(hoursForShift(s),8),0);
 const overtime=list.reduce((sum,s)=>sum+Math.max(0,hoursForShift(s)-8),0);
 const regularPay=regular*Number(state.settings.baseRate), overtimePay=overtime*Number(state.settings.baseRate)*Number(state.settings.overtimeMultiplier);

 const c=state.complaints.find(x=>x.id===id);if(!c)return;
 const reporter=c.anonymous?"Anonymous worker":worker(c.workerId).name;
 showModal("Safety report review",`<div class="space-y-4"><div class="flex flex-wrap justify-between gap-3"><div><div class="text-xs muted">Reference</div><div class="font-extrabold text-lg">${esc(c.id)}</div></div>${statusPill(c.status)}</div><div><div class="text-xs muted">Category · ${esc(siteName(c.siteId))}</div><div class="font-bold mt-1">${esc(c.category)}</div></div><div><div class="text-xs muted">Reporter</div><div class="font-semibold mt-1">${esc(reporter)}</div></div><div><div class="text-xs muted">Description</div><p class="mt-1 safe-text">${esc(c.description)}</p></div><div class="text-xs muted">Submitted ${fmtDate(c.createdAt)}</div>${c.resolution?`<div class="rounded-xl p-3 text-sm" style="background:var(--surface)"><strong>Resolution:</strong> ${esc(c.resolution)}</div>`:""}${state.role==="employer"?`<form id="complaintUpdateForm" class="space-y-3"><div><label for="complaintStatus">Status</label><select class="field" name="status" id="complaintStatus"><option value="pending">Pending</option><option value="reviewing">Under review</option><option value="escalated">Escalated</option><option value="resolved">Resolved</option></select></div><div><label for="assignedTo">Assign to (optional)</label><input class="field" id="assignedTo" name="assignedTo" maxlength="100" value="${esc(c.assignedTo||"")}" placeholder="e.g. Site safety officer"></div><div><label for="internalNote">Internal note (not shown to worker)</label><textarea class="field" name="note" id="internalNote" rows="2" maxlength="1000" placeholder="Internal follow-up note"></textarea></div><div><label for="complaintResolution">Resolution summary (visible to worker)</label><textarea class="field" name="resolution" id="complaintResolution" rows="2" maxlength="1000" placeholder="What action was taken?">${esc(c.resolution||"")}</textarea></div><button class="primary w-full" type="submit">Save report update</button></form>`:""}</div>`);
 if(state.role==="employer"){
  const select=document.getElementById("complaintStatus");select.value=c.status;
  document.getElementById("complaintUpdateForm").addEventListener("submit",e=>{e.preventDefault();const fd=new FormData(e.currentTarget);c.status=String(fd.get("status"));c.assignedTo=String(fd.get("assignedTo")).trim();const note=String(fd.get("note")).trim();if(note)c.notes.push({text:note,createdAt:isoNow()});c.resolution=String(fd.get("resolution")).trim();activity(`Employer updated safety report ${c.id} to ${c.status}`);save();closeModal();render();toast("Safety report updated.");});
 }
}
function renderSafeVoice(){
 const list=state.complaints.filter(c=>state.role==="employer"||c.workerId==="W-1001"||c.anonymous).slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
 return `${pageHeader(tr("safevoice"),"Report hazards, track progress, and close the loop.",`<button class="primary" onclick="openReportModal()">${icon("plus","w-4 h-4")} ${tr("newReport")}</button>`)}
 <div class="rounded-xl p-4 mb-5 flex gap-3 items-start" style="background:var(--peri-light);color:var(--plum)">${icon("shield-check","w-5 h-5 mt-0.5")}<div class="text-sm"><strong>Privacy matters.</strong> ${tr("anonymousNote")} Reports are stored only in this browser demo.</div></div>
 <section class="card">${cardTitle(state.role==="employer"?"Complaint management":"My reports","Open a report to review its status and any resolution.")}<div class="flex flex-wrap gap-3 mb-4"><input id="complaintSearch" class="field !w-auto flex-1 min-w-[180px]" placeholder="${tr("search")}" oninput="filterComplaints()"><select id="complaintFilter" class="field !w-auto" onchange="filterComplaints()"><option value="all">${tr("allStatus")}</option><option value="pending">Pending</option><option value="reviewing">Under review</option><option value="escalated">Escalated</option><option value="resolved">Resolved</option></select></div><div id="complaintList">${complaintCards(list)}</div></section>`;
}
function complaintCards(list){return list.length?`<div class="space-y-3">${list.map(c=>`<button class="w-full text-left border rounded-xl p-4 hover:bg-purple-50/30" style="border-color:var(--border)" onclick="openComplaint('${c.id}')"><div class="flex flex-wrap justify-between gap-3"><div class="min-w-0"><div class="font-bold">${esc(c.category)}</div><div class="text-xs muted mt-1">${esc(c.id)} · ${esc(siteName(c.siteId))} · ${fmtDate(c.createdAt)}</div><p class="text-sm mt-2 line-clamp-2">${esc(c.description)}</p><div class="text-xs muted mt-2">Reporter: ${c.anonymous?"Anonymous":esc(worker(c.workerId).name)}</div></div><div>${statusPill(c.status)}</div></div>${c.resolution?`<div class="text-xs mt-3 p-2 rounded-lg" style="background:var(--surface)"><strong>Resolution:</strong> ${esc(c.resolution)}</div>`:""}</button>`).join("")}</div>`:`<p class="muted text-sm py-6 text-center">${tr("noItems")}</p>`;}
function filterComplaints(){
 const search=(document.getElementById("complaintSearch")?.value||"").toLowerCase(),status=document.getElementById("complaintFilter")?.value||"all";
 const list=state.complaints.filter(c=>(state.role==="employer"||c.workerId==="W-1001"||c.anonymous)&&(status==="all"||c.status===status)&&`${c.id} ${c.category} ${c.description} ${c.anonymous?"anonymous":worker(c.workerId).name}`.toLowerCase().includes(search));
 document.getElementById("complaintList").innerHTML=complaintCards(list);if(window.lucide)lucide.createIcons();
}
function renderShiftGuard(){
 const alerts=state.alerts.filter(a=>state.role==="employer"||a.workerId==="W-1001");
 const threshold=Number(state.settings.dailyHoursThreshold);
 const derived=[];
 const byWorker={};
 state.shifts.forEach(s=>{byWorker[s.workerId]??=[];byWorker[s.workerId].push(s)});
 Object.entries(byWorker).forEach(([id,shifts])=>{const total=shifts.filter(s=>new Date(s.checkIn).toDateString()===new Date().toDateString()).reduce((sum,s)=>sum+hoursForShift(s),0);if(total>=threshold)derived.push({workerId:id,total,reason:`Recorded shifts today total ${total.toFixed(1)} hours, meeting/exceeding the ${threshold}-hour demo threshold.`});});
 return `${pageHeader(tr("shiftguard"),"Well-being alerts should prompt support and safer scheduling, not punishment.")}
 <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 grid-cards mb-5">${statCard("Daily-hours threshold",`${threshold} h`,"clock-alert","Configurable in Settings")}${statCard("Open alerts",alerts.filter(a=>a.status==="open").length,"heart-pulse","Saved alerts")}${statCard("Workers with current threshold flag",derived.length,"users","Calculated from today's timestamps")}</div>
 <section class="card mb-5">${cardTitle("Current alerts","Each alert includes a reason and a possible follow-up.")}${alerts.length?`<div class="space-y-3">${alerts.map(a=>`<div class="border rounded-xl p-4" style="border-color:var(--border)"><div class="flex flex-wrap justify-between gap-3"><div class="font-bold">${esc(worker(a.workerId).name)} · ${esc(a.type)}</div>${statusPill(a.status)}</div><p class="text-sm mt-2">${esc(a.message)}</p>${a.followUp?`<p class="text-sm mt-2"><strong>Follow-up:</strong> ${esc(a.followUp)}</p>`:""}${state.role==="employer"&&a.status==="open"?`<button class="secondary mt-3" onclick="followUpAlert('${a.id}')">Record follow-up</button>`:""}</div>`).join("")}`:`<p class="muted text-sm">${tr("noFatigue")}</p>`}</section>
 <section class="card">${cardTitle("Live threshold checks","Derived from stored shifts that started today.")}${derived.length?derived.map(d=>`<div class="rounded-xl p-4 mb-3 last:mb-0" style="background:#fff0cf"><div class="font-bold">${esc(worker(d.workerId).name)} · ${d.total.toFixed(1)} hours</div><p class="text-sm mt-1">${esc(d.reason)}</p><p class="text-xs mt-2">Suggested action: ${tr("noRest")}</p></div>`).join(""):`<p class="muted text-sm">No current shift crosses the configured threshold. Sample historic alert remains available for demo review.</p>`}</section>`;
}
function followUpAlert(id){
 const a=state.alerts.find(x=>x.id===id);if(!a)return;
 showModal("Record a supportive follow-up",`<form id="alertFollowForm" class="space-y-3"><p class="text-sm muted">${esc(a.message)}</p><div><label for="followText">Follow-up note</label><textarea class="field" id="followText" name="text" rows="3" required maxlength="1000" placeholder="e.g. Check rest time and discuss safe shift coverage"></textarea></div><button class="primary w-full" type="submit">Save follow-up</button></form>`);
 document.getElementById("alertFollowForm").addEventListener("submit",e=>{e.preventDefault();a.followUp=String(new FormData(e.currentTarget).get("text")).trim();a.status="reviewed";activity(`Supportive follow-up recorded for alert ${id}`);save();closeModal();render();toast("Follow-up saved.");});
}
function renderSkills(){
 const w=currentWorker();
 return `${pageHeader(tr("skills"),"A small skill passport and sample opportunities to support progression.")}
 <div class="grid grid-cols-1 lg:grid-cols-2 gap-5"><section class="card">${cardTitle(tr("skillPassport"),"Worker-controlled demo profile")}<div class="flex items-center gap-3 mb-5"><div class="brand-mark">${esc(w.name[0])}</div><div><div class="font-extrabold">${esc(w.name)}</div><div class="text-sm muted">${esc(w.role)}</div></div></div><div class="text-sm muted mb-2">Recorded skills</div><div class="flex flex-wrap gap-2">${w.skills.map(s=>`<span class="pill peri">${esc(s)}</span>`).join("")}</div><div class="mt-5"><label for="skillAdd">Add a skill</label><form class="flex gap-2" onsubmit="addSkill(event)"><input id="skillAdd" class="field" maxlength="60" placeholder="e.g. First aid"><button class="primary">Add</button></form></div><p class="text-xs muted mt-4">Skills are sample data stored in this browser.</p></section>
 <section class="card">${cardTitle(tr("opportunities"),"Sample listings, not live vacancies.")}<div class="space-y-3">${state.vacancies.filter(v=>v.industry===state.industry).map(v=>`<div class="border rounded-xl p-4" style="border-color:var(--border)"><div class="font-bold">${esc(v.title)}</div><div class="text-xs muted mt-1">${esc(v.location)} · ${esc(v.industry)}</div><div class="flex flex-wrap gap-2 mt-3">${v.skills.map(s=>`<span class="pill">${esc(s)}</span>`).join("")}</div><button class="secondary mt-3" onclick="toast('Sample opportunity saved to this demo session.')">Save opportunity</button></div>`).join("")||`<p class="muted text-sm">${tr("noItems")}</p>`}</div></section></div>`;
}
function addSkill(e){e.preventDefault();const el=document.getElementById("skillAdd"),s=el.value.trim();if(!s)return;const w=currentWorker();if(!w.skills.includes(s))w.skills.push(s);activity(`Skill added to ${w.name}'s demo passport`);save();render();toast("Skill added.");}
function renderSettings(){
 return `${pageHeader(tr("settings"),"Configure demo rules and reset local sample data.")}
 <div class="grid grid-cols-1 lg:grid-cols-2 gap-5"><section class="card">${cardTitle("Workforce settings","Changes affect calculations and alerts in this browser.")}<form id="settingsForm" class="space-y-4"><div><label for="industry">${tr("industry")}</label><select id="industry" name="industry" class="field"><option value="construction">Construction</option><option value="maintenance">Facility maintenance</option></select><p class="text-xs muted mt-1">${tr("industryHint")}</p></div><div><label for="baseRate">Base hourly rate (₹)</label><input class="field" type="number" min="1" step=".5" name="baseRate" id="baseRate" required></div><div><label for="otMultiplier">Overtime multiplier</label><input class="field" type="number" min="1" max="5" step=".1" name="overtimeMultiplier" id="otMultiplier" required></div><div><label for="threshold">Daily hours fatigue threshold</label><input class="field" type="number" min="1" max="24" step=".5" name="dailyHoursThreshold" id="threshold" required></div><div><label for="siteRadius">Worksite radius (metres)</label><input class="field" type="number" min="10" max="5000" step="10" name="siteRadius" id="siteRadius" required></div><button class="primary" type="submit">${tr("save")}</button></form></section>
 <section class="card">${cardTitle("Prototype information","Be transparent about the boundaries of this demo.")}<div class="space-y-3 text-sm"><div class="flex gap-3"><div class="icon-box">${icon("database")}</div><div><div class="font-bold">Local browser storage</div><p class="muted mt-1">Data is saved in localStorage on this device and browser. It is not shared across devices or users.</p></div></div><div class="flex gap-3"><div class="icon-box">${icon("map-pin")}</div><div><div class="font-bold">Location permission</div><p class="muted mt-1">GPS requires browser permission and a secure context such as HTTPS or localhost. Simulated states are not real checks.</p></div></div><div class="flex gap-3"><div class="icon-box">${icon("shield-alert")}</div><div><div class="font-bold">Privacy limits</div><p class="muted mt-1">This is not a secure anonymous reporting service. Do not use real sensitive reports.</p></div></div><div class="flex gap-3"><div class="icon-box">${icon("qr-code")}</div><div><div class="font-bold">QR and opportunities</div><p class="muted mt-1">QR validation and job listings are simulated demo features.</p></div></div></div><div class="border-t mt-5 pt-5" style="border-color:var(--border)"><button class="w-full rounded-xl border border-red-200 text-red-700 p-3 font-bold hover:bg-red-50" onclick="confirmReset()">${icon("trash-2","w-4 h-4 inline mr-2")} ${tr("reset")}</button></div></section></div>`;
}
function confirmReset(){showModal("Reset demo data?",`<p class="text-sm muted">${tr("resetConfirm")}</p>`,`<button class="ghost" onclick="closeModal()">${tr("cancel")}</button><button class="primary" onclick="resetData()">Reset data</button>`);}
function resetData(){state=seedData();save();closeModal();render();toast(tr("resetDone"));}
function render(){
 renderNav();
 const pageTitles={dashboard:state.role==="worker"?tr("workerDash"):tr("employerDash"),attendance:tr("attendance"),fairpay:tr("fairpay"),safevoice:tr("safevoice"),shiftguard:tr("shiftguard"),skills:tr("skills"),settings:tr("settings")};
 document.getElementById("pageTitle").textContent=pageTitles[state.page]||"FairShift";
 document.getElementById("crumb").textContent=(state.page==="dashboard"?"DASHBOARD":state.page.toUpperCase());
 document.getElementById("role").value=state.role;document.getElementById("language").value=state.language;
 const renderer={dashboard:renderDashboard,attendance:renderAttendance,fairpay:renderFairPay,safevoice:renderSafeVoice,shiftguard:renderShiftGuard,skills:renderSkills,settings:renderSettings};
 document.getElementById("content").innerHTML=renderer[state.page]?renderer[state.page]():"";
 if(state.page==="settings"){document.getElementById("industry").value=state.industry;document.getElementById("baseRate").value=state.settings.baseRate;document.getElementById("otMultiplier").value=state.settings.overtimeMultiplier;document.getElementById("threshold").value=state.settings.dailyHoursThreshold;document.getElementById("siteRadius").value=state.settings.siteRadius;document.getElementById("settingsForm").addEventListener("submit",saveSettings);}
 if(window.lucide)lucide.createIcons();
}
function saveSettings(e){
 e.preventDefault();const fd=new FormData(e.currentTarget),rate=Number(fd.get("baseRate")),multi=Number(fd.get("overtimeMultiplier")),threshold=Number(fd.get("dailyHoursThreshold")),radius=Number(fd.get("siteRadius"));
 if(rate<=0||multi<1||threshold<=0||threshold>24||radius<10){toast("Please enter valid settings.");return;}
 state.settings.baseRate=rate;state.settings.overtimeMultiplier=multi;state.settings.dailyHoursThreshold=threshold;state.settings.siteRadius=radius;
 const nextIndustry=String(fd.get("industry"));if(nextIndustry!==state.industry){state.industry=nextIndustry;state.workers[0].industry=nextIndustry;state.workers[0].siteId=nextIndustry==="construction"?"SITE-A":"SITE-B";}
 activity("Workforce demo settings updated");save();render();toast(tr("saved"));
}
function checkIn(){
 if(state.shifts.some(s=>s.workerId==="W-1001"&&!s.checkOut)){toast("You already have an active shift.");return;}
 const s={id:uid("SH"),workerId:"W-1001",siteId:currentWorker().siteId,checkIn:isoNow(),checkOut:null,gpsStatus:state.gps.status==="verified"?"verified":state.gps.status==="outside"?"outside":"not_checked",industry:state.industry};
 state.shifts.unshift(s);activity("Worker checked in");save();render();toast(tr("checkinDone"));
}
function checkOut(){
 const s=state.shifts.find(x=>x.workerId==="W-1001"&&!x.checkOut);if(!s){toast("No active shift to check out from.");return;}
 s.checkOut=isoNow();activity("Worker checked out");save();render();toast(tr("checkoutDone"));
}
function haversine(lat1,lon1,lat2,lon2){const R=6371000,toRad=d=>d*Math.PI/180,dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1),a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
function checkGPS(){
 if(!navigator.geolocation){state.gps={status:"denied",message:"Geolocation is not supported by this browser.",distance:null,accuracy:null};save();render();toast(state.gps.message);return;}
 state.gps.message=tr("gpsWait");render();
 navigator.geolocation.getCurrentPosition(pos=>{
  const {latitude,longitude,accuracy}=pos.coords,site=state.sites.find(s=>s.id===currentWorker().siteId)||state.sites[0],distance=haversine(latitude,longitude,site.lat,site.lon),radius=Number(state.settings.siteRadius);
  let status="verified",message=tr("gpsVerified");
  if(accuracy>Number(state.settings.maxGpsAccuracy)){status="low_accuracy";message=tr("gpsAccuracy");}
  else if(distance>radius){status="outside";message=tr("gpsOutside");}
  state.gps={status,message,distance,accuracy,checkedAt:isoNow()};save();render();toast(message);
 },err=>{const msg=err.code===1?"Location permission denied.":err.code===2?"Location unavailable.":"Location request timed out.";state.gps={status:"denied",message:msg,distance:null,accuracy:null,checkedAt:isoNow()};save();render();toast(msg);},{enableHighAccuracy:true,timeout:10000,maximumAge:0});
}
function simulateGPS(status){
 const map={verified:{message:tr("gpsVerified"),distance:50,accuracy:15},outside:{message:tr("gpsOutside"),distance:500,accuracy:20},low_accuracy:{message:tr("gpsAccuracy"),distance:70,accuracy:250},denied:{message:tr("gpsDenied"),distance:null,accuracy:null}};
 state.gps={status,...map[status],simulated:true,checkedAt:isoNow()};save();render();toast("Simulated GPS state: "+status.replace("_"," "));
}
function simulateQR(){showModal("QR check-in simulation",`<div class="text-center py-4"><div class="icon-box !w-16 !h-16 mx-auto mb-4">${icon("qr-code","w-8 h-8")}</div><div class="font-bold">Demo QR accepted</div><p class="muted text-sm mt-2">This is a simulation only. No real QR code was scanned or validated.</p></div>`,`<button class="ghost" onclick="closeModal()">Close</button><button class="primary" onclick="closeModal();checkIn()">Continue to check in</button>`);}
function tickTimer(){
 // Keep the visible duration fresh while a worker is on shift.
 if(state.page==="dashboard"&&state.role==="worker"){
  const el=document.querySelector("[data-live-hours]");if(el)el.textContent=fmtHours(hoursForShift(el.dataset.liveHours));
 }
}
function init(){
 render();
 // Bind the settings form after rendering and refresh the visible shift timer periodically.
 setInterval(()=>{const active=state.shifts.find(s=>s.workerId==="W-1001"&&!s.checkOut);const timer=document.getElementById("liveTimer");if(timer&&active)timer.textContent=fmtHours(hoursForShift(active));},30000);
}
init();
</script>
</body>
</html>
